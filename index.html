<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keystone — your reusable workspace</title>
  <style>
    :root { --bg:#0b0c10; --panel:#13151b; --panel-2:#191b23; --line:#292c36; --muted:#9297a5; --text:#f4f5f7; --accent:#a78bfa; --accent-2:#8b5cf6; --green:#6ee7b7; --amber:#fbbf72; --blue:#75b8ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing:.005em; }
    button,input,textarea { font:inherit; color:inherit; } button { border:0; cursor:pointer; } svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app { display:flex; min-height:100vh; height:100vh; overflow:hidden; background:radial-gradient(ellipse 800px 500px at 60% -20%, rgba(91,52,157,.12), transparent 70%); }
    .sidebar { width:228px; flex:none; padding:22px 14px 16px; border-right:1px solid var(--line); background:rgba(13,14,18,.78); display:flex; flex-direction:column; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin:0 10px 28px; letter-spacing:-.02em; }
    .brandmark { display:grid; place-items:center; width:27px; height:27px; border-radius:8px; color:#fff; background:linear-gradient(135deg,#c4b5fd,#7c3aed); box-shadow:0 5px 18px #7c3aed3d; }
    .brandmark svg { width:15px; }
    .nav-label { color:#676b79; font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; padding:0 11px; margin:19px 0 7px; }
    .nav-item { width:100%; display:flex; align-items:center; gap:11px; color:#aeb1bd; background:none; border-radius:7px; padding:9px 11px; text-align:left; margin:1px 0; }
    .nav-item:hover,.nav-item.active { color:#fff; background:#24202f; } .nav-item.active { box-shadow:inset 2px 0 0 var(--accent); }
    .count { margin-left:auto; color:#777b88; font-size:11px; } .nav-item.active .count { color:#c4b5fd; }
    .sidebar-bottom { margin-top:auto; border-top:1px solid var(--line); padding-top:13px; }.user { display:flex; align-items:center; gap:9px; padding:8px 10px; color:#b4b6c0; }
    .avatar { width:27px; height:27px; border-radius:50%; display:grid; place-items:center; background:#334155; color:#cbd5e1; font-size:10px; font-weight:700; }
    .content { flex:1; min-width:0; display:flex; flex-direction:column; }
    .topbar { height:72px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .crumb { display:flex; align-items:center; gap:8px; color:#858a98; }.crumb strong { color:#f2f3f5; font-size:14px; }.crumb svg { width:13px; color:#606471; }
    .actions { display:flex; gap:9px; align-items:center; }.icon-btn { background:transparent; color:#8c909d; padding:8px; border-radius:7px; display:grid; place-items:center; }.icon-btn:hover { color:#fff; background:#20222a; }
    .primary { background:#eeeafd; color:#251b45; padding:8px 13px; border-radius:7px; display:flex; gap:7px; align-items:center; font-weight:650; box-shadow:0 4px 14px #8b5cf624; }.primary:hover { background:#fff; }
    .main { flex:1; min-height:0; display:flex; }.library { width:43%; min-width:420px; padding:25px 26px; border-right:1px solid var(--line); overflow:auto; }.detail { flex:1; min-width:390px; padding:28px 31px; overflow:auto; background:rgba(14,15,20,.46); }
    .intro { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:19px; }.intro h1 { margin:0; font-size:21px; letter-spacing:-.035em; }.intro p { margin:5px 0 0; color:var(--muted); font-size:12px; }.shortcut { color:#777b87; font-size:11px; padding-top:3px; }
    .search { height:38px; display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#171920; border-radius:8px; padding:0 12px; color:#777b88; margin-bottom:14px; }.search:focus-within { border-color:#65538f; box-shadow:0 0 0 3px #8b5cf612; }.search input { outline:0; border:0; background:transparent; width:100%; font-size:12px; }.search kbd { border:1px solid #363944; border-radius:4px; padding:2px 6px; color:#737785; font-size:10px; white-space:nowrap; }
    .filters { display:flex; gap:7px; align-items:center; margin-bottom:18px; overflow:auto; }.filter { background:#181a21; color:#969aa7; border:1px solid var(--line); border-radius:20px; padding:5px 10px; font-size:11px; white-space:nowrap; }.filter:hover,.filter.selected { color:#ddd6fe; background:#282039; border-color:#584587; }.sort { margin-left:auto; background:none; color:#777b88; display:flex; gap:5px; align-items:center; font-size:11px; white-space:nowrap; }
    .cards { display:flex; flex-direction:column; gap:7px; }.card { padding:13px 14px; border:1px solid transparent; border-radius:9px; background:#14161c; cursor:pointer; transition:.15s; }.card:hover { background:#191b23; border-color:#30333d; }.card.selected { background:#211c2d; border-color:#604a91; box-shadow:0 0 0 1px #8b5cf614; }.card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }.card-title { font-weight:650; font-size:13px; color:#e9e9ee; }.card-title .star { color:#f5c878; margin-left:5px; }.type { font-size:10px; color:#828794; padding:3px 7px; border-radius:4px; background:#24262e; }.card p { color:#969aa7; font-size:11.5px; margin:0 0 11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.card-foot { display:flex; align-items:center; gap:7px; color:#737785; font-size:10px; }.tag { border-radius:3px; color:#b9a9e6; background:#2c2441; padding:3px 6px; }.tag.blue { color:#9cc9fa; background:#1c2f45; }.tag.green { color:#96e5c5; background:#18382f; }.tag.amber { color:#f1c786; background:#3a2c1d; }.updated { margin-left:auto; }.empty { text-align:center; color:var(--muted); padding:50px 10px; }
    .detail-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; padding-bottom:20px; border-bottom:1px solid var(--line); }.detail-title { display:flex; gap:11px; align-items:flex-start; }.large-icon { width:35px; height:35px; display:grid; place-items:center; color:#c4b5fd; background:#30264a; border-radius:8px; }.detail h2 { font-size:19px; margin:0 0 4px; letter-spacing:-.03em; }.detail-sub { color:#9297a5; font-size:11px; }.detail-tools { display:flex; gap:4px; }.edit-btn { display:flex; gap:6px; align-items:center; color:#bbb0df; background:#29223c; padding:7px 10px; border-radius:6px; font-size:11px; }.edit-btn:hover { background:#3b2e57; }.detail-section { margin-top:22px; }.section-label { display:flex; justify-content:space-between; color:#777b88; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-bottom:9px; }.copy-btn { color:#aaa3c5; background:none; text-transform:none; letter-spacing:0; font-size:11px; font-weight:500; }.copy-btn:hover { color:white; }
    .code { background:#101116; border:1px solid #272a34; border-radius:8px; padding:15px 16px; color:#d9d5e7; font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; overflow:auto; }.code .comment { color:#6f7080; }.code .key { color:#c4b5fd; }.code .string { color:#a5d6a7; }.code .flag { color:#f2c67f; }
    .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }.meta-value { color:#d4d5db; font-size:12px; }.meta-value span { color:#9297a5; }.files { display:flex; flex-direction:column; gap:7px; }.file { display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#171920; border-radius:7px; padding:9px 10px; }.file-icon { color:#a7bff5; }.file-name { font-size:11px; }.file-size { color:#777b88; font-size:10px; margin-left:auto; }.file-download { color:#7d8190; background:none; padding:3px; }
    .tip { margin-top:22px; border:1px solid #3b3158; background:linear-gradient(100deg,#211b31,#191a24); border-radius:8px; padding:12px; display:flex; gap:9px; color:#b8b0ca; font-size:11px; }.tip svg { color:#b59cfa; flex:none; }.tip strong { color:#ded7f0; }
    .modal-wrap { position:fixed; inset:0; display:none; place-items:center; background:#050508a8; backdrop-filter:blur(5px); z-index:5; }.modal-wrap.open { display:grid; }.modal { width:500px; background:#1a1b22; border:1px solid #393b48; border-radius:11px; box-shadow:0 20px 80px #000b; padding:22px; }.modal h2 { margin:0 0 4px; font-size:17px; }.modal .hint { margin:0 0 19px; color:#898d9a; font-size:11px; }.form-row { margin:12px 0; }.form-row label { display:block; color:#a9acb7; font-size:11px; margin-bottom:6px; }.form-row input,.form-row textarea { width:100%; border:1px solid #353844; border-radius:6px; background:#111217; padding:9px 10px; outline:none; }.form-row input:focus,.form-row textarea:focus { border-color:#8063ba; }.form-row textarea { min-height:145px; resize:vertical; font:11px/1.6 ui-monospace,monospace; }.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }.cancel { background:#282a32; padding:8px 13px; border-radius:6px; color:#b7b9c2; }.save { background:#a78bfa; color:#1e1635; padding:8px 15px; border-radius:6px; font-weight:650; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#e8e2fa; color:#211936; padding:9px 15px; border-radius:7px; box-shadow:0 8px 30px #0008; font-weight:600; font-size:12px; transition:.22s; z-index:10; }.toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:850px){ .sidebar{width:64px;padding:20px 8px}.brand{margin:0 auto 28px}.brand span,.nav-item span,.count,.nav-label,.user span{display:none}.nav-item{justify-content:center;padding:10px}.user{justify-content:center}.library{min-width:350px;width:50%;padding:20px 16px}.detail{padding:22px 19px} }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="m8 9.5 4 2.2 4-2.2M12 12v5"/></svg></div><span>Keystone</span></div>
    <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg><span>Library</span><b class="count" id="libraryCount">12</b></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg><span>Favorites</span><b class="count">4</b></button>
    <div class="nav-label">Collections</div>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg><span>Prompts</span><b class="count">8</b></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="m4 17 4-4 3 3 5-6 4 4"/><path d="M4 20h16"/></svg><span>Design files</span><b class="count">6</b></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M8 9h8M8 13h5"/><path d="M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-3.8-.9L4 20l1.4-3.7A8 8 0 1 1 20 11.5Z"/></svg><span>Snippets</span><b class="count">10</b></button>
    <div class="nav-label">Workspace</div>
    <button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8.1 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.5a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5H15v.5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.5H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>Settings</span></button>
    <div class="sidebar-bottom"><div class="user"><div class="avatar">JD</div><span>Jordan Davis</span><svg style="margin-left:auto;width:13px" viewBox="0 0 24 24"><path d="m8 9 4 4 4-4"/></svg></div></div>
  </aside>
  <section class="content">
    <header class="topbar"><div class="crumb"><strong>Library</strong><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span>All items</span></div><div class="actions"><button class="icon-btn" title="Quick search" onclick="focusSearch()"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><button class="icon-btn" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.4 1.6c-1.1 1-2 1.4-2 3M12 17h.01"/></svg></button><button class="primary" onclick="openModal()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New item</button></div></header>
    <main class="main"><div class="library">
      <div class="intro"><div><h1>Your library</h1><p>Everything you want to take with you.</p></div><span class="shortcut">⌘ K to search</span></div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="Search skills, files, and snippets..." oninput="render()"/><kbd>⌘ K</kbd></div>
      <div class="filters"><button class="filter selected" data-filter="All" onclick="setFilter(this)">All items</button><button class="filter" data-filter="Prompt" onclick="setFilter(this)">Prompts</button><button class="filter" data-filter="File" onclick="setFilter(this)">Design files</button><button class="filter" data-filter="Snippet" onclick="setFilter(this)">Snippets</button><button class="sort">Recently updated <span>⌄</span></button></div>
      <div class="cards" id="cards"></div>
    </div><div class="detail" id="detail"></div></main>
  </section>
</div>
<div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveItem(event)"><h2 id="modalTitle">Add to your library</h2><p class="hint">Save a reusable skill, prompt, snippet, or any file you want close at hand.</p><div class="form-row"><label for="itemName">Name</label><input id="itemName" required placeholder="e.g. Accessible button checklist" /></div><div class="form-row"><label for="itemType">Type · Prompt, Snippet, or File</label><input id="itemType" value="Prompt" placeholder="Prompt" /></div><div class="form-row"><label for="itemDescription">Description</label><input id="itemDescription" placeholder="A short note to help you find it later" /></div><div class="form-row"><label for="itemContent">Content</label><textarea id="itemContent" required placeholder="Paste your prompt, command, or notes here..."></textarea></div><div class="modal-actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="save">Save item</button></div></form></div><div class="toast" id="toast">Copied to clipboard</div>
<script>
const initial=[
 {id:1,name:'Senior frontend review',type:'Prompt',description:'Thoroughly review a pull request for quality, accessibility, and maintainability.',tags:['Work','Code'],tone:'purple',updated:'2 min ago',favorite:true,content:'You are a senior frontend engineer. Review the code below for:\n\n1. Bugs and edge cases\n2. Accessibility (WCAG 2.2 AA)\n3. Performance and maintainability\n4. Clear, actionable improvements\n\nExplain the why behind each suggestion and include a concise summary at the end.'},
 {id:2,name:'Warm product launch copy',type:'Prompt',description:'Turn rough product notes into clear, confident launch messaging.',tags:['Writing','Marketing'],tone:'amber',updated:'Yesterday',favorite:true,content:'Act as a thoughtful product copywriter. Turn the notes below into launch copy that feels clear, warm, and confident. Avoid hype and jargon. Give me: a headline, a one-line value proposition, and three short benefits.\n\nNotes:\n[Paste notes here]'},
 {id:3,name:'SaaS dashboard starter',type:'File',description:'A clean, responsive dashboard foundation with tokens and components.',tags:['Figma','UI kit'],tone:'blue',updated:'Jun 18',favorite:true,content:'A starter design system for SaaS dashboards: color tokens, type scale, spacing, buttons, inputs, cards, navigation, and responsive layout patterns.',files:[['dashboard-starter.fig','2.4 MB']]},
 {id:4,name:'Commit message helper',type:'Snippet',description:'Generate a conventional commit message from a short change summary.',tags:['Git','Code'],tone:'green',updated:'Jun 16',content:'git diff --staged | aichat "Write a concise conventional commit message for these changes. Output only the message."'},
 {id:5,name:'Meeting notes → actions',type:'Prompt',description:'Turn messy notes into clear decisions, owners, and next steps.',tags:['Work','Writing'],tone:'purple',updated:'Jun 12',content:'Turn these meeting notes into a scannable summary. Separate decisions, open questions, action items, and owners. Flag anything that has no owner or deadline.\n\nNotes:\n[Paste meeting notes here]'},
 {id:6,name:'Icon exploration board',type:'File',description:'Exploration board for the Keystone icon family.',tags:['Figma','Brand'],tone:'blue',updated:'Jun 08',content:'Icon exploration board with 24px grid, stroke studies, and export-ready SVG explorations.',files:[['icon-exploration.fig','840 KB']]}
];
let items=JSON.parse(localStorage.getItem('keystone-items')||'null')||initial; let selected=1, activeFilter='All', editing=null;
function render(){ const q=(document.getElementById('search').value||'').toLowerCase(); const visible=items.filter(x=>(activeFilter==='All'||x.type===activeFilter)&&[x.name,x.description,x.type,...x.tags].join(' ').toLowerCase().includes(q)); document.getElementById('cards').innerHTML=visible.length?visible.map(x=>`<article class="card ${x.id===selected?'selected':''}" onclick="selectItem(${x.id})"><div class="card-head"><div class="card-title">${x.name}${x.favorite?'<span class="star">★</span>':''}</div><span class="type">${x.type}</span></div><p>${x.description}</p><div class="card-foot">${x.tags.slice(0,2).map((t,i)=>`<span class="tag ${x.tone==='blue'?'blue':x.tone==='green'?'green':x.tone==='amber'?'amber':''}">${t}</span>`).join('')}<span class="updated">${x.updated}</span></div></article>`).join(''):'<div class="empty">No items found.<br><small>Try another search or add something new.</small></div>'; document.getElementById('libraryCount').textContent=items.length; if(visible.length&&!visible.some(x=>x.id===selected)){selected=visible[0].id} renderDetail(); }
function renderDetail(){let x=items.find(i=>i.id===selected)||items[0];if(!x){document.getElementById('detail').innerHTML='<div class="empty">Your library is empty.</div>';return} document.getElementById('detail').innerHTML=`<div class="detail-head"><div class="detail-title"><div class="large-icon">${x.type==='File'?'▧':x.type==='Snippet'?'⌘':'✦'}</div><div><h2>${x.name} ${x.favorite?'<span class="star">★</span>':''}</h2><div class="detail-sub">${x.type} · Updated ${x.updated}</div></div></div><div class="detail-tools"><button class="icon-btn" title="Favorite" onclick="toggleFavorite()">${x.favorite?'★':'☆'}</button><button class="edit-btn" onclick="openModal(${x.id})">Edit <svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20ZM14 7l3 3"/></svg></button></div></div><div class="detail-section"><div class="section-label">Description</div><div class="meta-value">${x.description}</div></div><div class="detail-section"><div class="section-label"><span>${x.type==='File'?'Notes':'Content'}</span><button class="copy-btn" onclick="copyItem()">Copy to clipboard <svg style="width:12px;vertical-align:-2px" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div><div class="code">${escapeHtml(x.content)}</div></div>${x.files?`<div class="detail-section"><div class="section-label">Attached files</div><div class="files">${x.files.map(f=>`<div class="file"><span class="file-icon">▧</span><span class="file-name">${f[0]}</span><span class="file-size">${f[1]}</span><button class="file-download" onclick="toast('File ready to export')">↓</button></div>`).join('')}</div></div>`:''}<div class="detail-section"><div class="section-label">Details</div><div class="meta-grid"><div><div class="section-label">Collection</div><div class="meta-value">${x.type==='File'?'Design files':x.type==='Snippet'?'Snippets':'Prompts'}</div></div><div><div class="section-label">Tags</div><div class="meta-value">${x.tags.join('  ·  ')}</div></div></div></div><div class="tip"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8.5 14.5C7.6 13.7 7 12.5 7 11a5 5 0 0 1 10 0c0 1.5-.6 2.7-1.5 3.5-.8.7-1.5 1.3-1.5 2.5h-4c0-1.2-.7-1.8-1.5-2.5Z"/></svg><div><strong>Use it anywhere</strong><br>Copy once, then paste into your terminal, IDE, or favorite chat. Keystone stays out of your way.</div></div>`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))} function selectItem(id){selected=id;render()} function setFilter(el){activeFilter=el.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');render()} function focusSearch(){document.getElementById('search').focus()} function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)} async function copyItem(){let x=items.find(i=>i.id===selected);try{await navigator.clipboard.writeText(x.content)}catch(e){}toast('Copied to clipboard')} function toggleFavorite(){let x=items.find(i=>i.id===selected);x.favorite=!x.favorite;persist();render()}
function openModal(id){editing=id||null;let x=items.find(i=>i.id===id);document.getElementById('modalTitle').textContent=x?'Edit item':'Add to your library';document.getElementById('itemName').value=x?.name||'';document.getElementById('itemType').value=x?.type||'Prompt';document.getElementById('itemDescription').value=x?.description||'';document.getElementById('itemContent').value=x?.content||'';document.getElementById('modalWrap').classList.add('open');setTimeout(()=>document.getElementById('itemName').focus(),50)} function closeModal(){document.getElementById('modalWrap').classList.remove('open')} function saveItem(e){e.preventDefault();let old=items.find(i=>i.id===editing);let x={id:editing||Date.now(),name:document.getElementById('itemName').value,type:document.getElementById('itemType').value||'Prompt',description:document.getElementById('itemDescription').value||'Saved item',tags:old?.tags||['Personal'],tone:old?.tone||'purple',updated:'Just now',favorite:old?.favorite||false,content:document.getElementById('itemContent').value,files:old?.files};if(editing)items=items.map(i=>i.id===editing?x:i);else{items.unshift(x);selected=x.id}persist();closeModal();render();toast(editing?'Item updated':'Added to your library')} function persist(){localStorage.setItem('keystone-items',JSON.stringify(items))} document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}if(e.key==='Escape')closeModal()});render();
