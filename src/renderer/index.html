<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keystone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #13151b;
      --panel-2: #191b23;
      --line: #292c36;
      --muted: #9297a5;
      --text: #f4f5f7;
      --accent: #a78bfa;
      --accent-2: #8b5cf6;
      --green: #6ee7b7;
      --amber: #fbbf72;
      --blue: #75b8ff;
      --purple: #c4b5fd;
      --purple-bg: #30264a;
      --red: #f87171;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 11px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --shadow-lg: 0 20px 80px rgba(0,0,0,0.6);
      --transition: 0.15s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100%; 
      width: 100%;
      overflow: hidden;
    }

    body {
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: .005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
    }

    button { cursor: pointer; background: none; }
    
    svg { 
      width: 16px; 
      height: 16px; 
      stroke: currentColor; 
      fill: none; 
      stroke-width: 1.8; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      flex-shrink: 0;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4150; }

    /* App Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 800px 500px at 60% -20%, rgba(91,52,157,.12), transparent 70%);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(19, 21, 27, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -.02em;
    }

    .brandmark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      color: #fff;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      box-shadow: 0 4px 14px #7c3aed3d;
    }

    .brandmark svg { width: 13px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      background: transparent;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #eeeafd, #ddd6fe);
      color: #251b45;
      font-weight: 650;
      font-size: 12px;
      box-shadow: 0 3px 10px #8b5cf624;
      transition: var(--transition);
      border: none;
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, #fff, #f3f0ff);
      box-shadow: 0 4px 16px #8b5cf633;
    }

    .primary-btn:active { transform: scale(0.98); }

    .primary-btn svg { width: 14px; height: 14px; }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 16px 10px;
      border-right: 1px solid var(--line);
      background: rgba(13, 14, 18, 0.85);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 20px;
    }

    .nav-label {
      color: #676b79;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 700;
      padding: 0 10px;
      margin-bottom: 8px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aeb1bd;
      background: none;
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      text-align: left;
      margin: 2px 0;
      transition: var(--transition);
      border: none;
      font-size: 13px;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #fff;
      background: #24202f;
    }

    .nav-item.active {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .nav-item svg { color: inherit; }

    .nav-count {
      margin-left: auto;
      color: #777b88;
      font-size: 11px;
      font-weight: 500;
    }

    .nav-item.active .nav-count { color: var(--purple); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      color: #b4b6c0;
      font-size: 12px;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #334155;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
    }

    /* Library View */
    .library {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .library-title h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.035em;
      margin: 0;
    }

    .library-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .shortcut-hint {
      color: #777b87;
      font-size: 11px;
      padding-top: 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 36px;
      border: 1px solid var(--line);
      background: #171920;
      border-radius: var(--radius-md);
      padding: 0 12px;
      color: #777b88;
      margin-bottom: 12px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .search-box:focus-within {
      border-color: #65538f;
      box-shadow: 0 0 0 3px #8b5cf612;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      font-size: 12px;
      width: 100%;
    }

    .search-box kbd {
      display: flex;
      align-items: center;
      gap: 3px;
      border: 1px solid #363944;
      border-radius: 4px;
      padding: 2px 6px;
      color: #737785;
      font-size: 10px;
      white-space: nowrap;
      font-family: inherit;
    }

    .search-box kbd span { color: var(--muted); }

    .filters {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .filter-btn {
      background: #181a21;
      color: #969aa7;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      white-space: nowrap;
      transition: var(--transition);
    }

    .filter-btn:hover,
    .filter-btn.active {
      color: #ddd6fe;
      background: #282039;
      border-color: #584587;
    }

    .sort-btn {
      margin-left: auto;
      background: none;
      color: #777b88;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      padding: 5px 8px;
      border-radius: 20px;
      transition: var(--transition);
    }

    .sort-btn:hover { color: var(--text); background: var(--panel-2); }

    .cards-container {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card {
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: #14161c;
      cursor: pointer;
      transition: var(--transition);
    }

    .card:hover { background: #191b23; border-color: #30333d; }
    .card.selected { background: #211c2d; border-color: #604a91; box-shadow: 0 0 0 1px #8b5cf614; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }

    .card-title {
      font-weight: 650;
      font-size: 13px;
      color: #e9e9ee;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .star-badge {
      color: #f5c878;
      margin-left: 5px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .card-type {
      font-size: 10px;
      color: #828794;
      padding: 2px 7px;
      border-radius: 4px;
      background: #24262e;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-description {
      color: #969aa7;
      font-size: 11.5px;
      margin: 0 0 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #737785;
      font-size: 10px;
    }

    .tag {
      border-radius: 3px;
      color: #b9a9e6;
      background: #2c2441;
      padding: 2px 6px;
      font-size: 10px;
    }

    .tag.blue { color: #9cc9fa; background: #1c2f45; }
    .tag.green { color: #96e5c5; background: #18382f; }
    .tag.amber { color: #f1c786; background: #3a2c1d; }
    .tag.purple { color: #c4b5fd; background: #2c2441; }

    .card-updated { margin-left: auto; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 13px;
    }

    .empty-state small { display: block; margin-top: 6px; color: #676b79; }

    /* Detail View */
    .detail {
      width: 100%;
      max-width: 480px;
      flex-shrink: 0;
      padding: 24px;
      overflow-y: auto;
      background: rgba(14, 15, 20, 0.46);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
    }

    .detail-empty svg { color: #3d4150; margin-bottom: 12px; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .detail-title-area {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
    }

    .large-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--purple);
      background: var(--purple-bg);
      border-radius: 8px;
      flex-shrink: 0;
      font-size: 16px;
    }

    .detail-title-area h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-sub {
      color: #9297a5;
      font-size: 11px;
    }

    .detail-tools {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      transition: var(--transition);
    }

    .tool-btn.icon-only { padding: 6px; }

    .favorite-btn {
      color: #bbb0df;
      background: #29223c;
    }

    .favorite-btn:hover { background: #3b2e57; }
    .favorite-btn.active { color: #f5c878; background: #3a2c1d; }

    .edit-btn {
      color: #bbb0df;
      background: #29223c;
    }

    .edit-btn:hover { background: #3b2e57; }

    .delete-btn {
      color: var(--red);
      background: #3a2424;
    }

    .delete-btn:hover { background: #4a2a2a; }

    .detail-section {
      margin-top: 18px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      color: #777b88;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 8px;
    }

    .copy-btn {
      color: #aaa3c5;
      background: none;
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .copy-btn:hover { color: white; background: var(--panel-2); }
    .copy-btn.copied { color: var(--green); }

    .code-block {
      background: #101116;
      border: 1px solid #272a34;
      border-radius: var(--radius-md);
      padding: 14px 15px;
      color: #d9d5e7;
      font: 11.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: auto;
      max-height: 300px;
    }

    .code-block .comment { color: #6f7080; }
    .code-block .key { color: var(--purple); }
    .code-block .string { color: var(--green); }
    .code-block .flag { color: var(--amber); }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meta-item { display: flex; flex-direction: column; gap: 3px; }

    .meta-label { color: #777b88; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }

    .meta-value { color: #d4d5db; font-size: 12px; }

    .meta-value span { color: #9297a5; }

    .files-list { display: flex; flex-direction: column; gap: 6px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      background: #171920;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .file-icon { color: #a7bff5; font-size: 14px; }
    .file-name { font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: #777b88; font-size: 10px; white-space: nowrap; }
    .file-download { color: #7d8190; background: none; padding: 3px; display: grid; place-items: center; border-radius: 4px; transition: var(--transition); }
    .file-download:hover { color: var(--text); background: var(--panel-2); }

    .tip-box {
      margin-top: 20px;
      border: 1px solid #3b3158;
      background: linear-gradient(100deg, #211b31, #191a24);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 9px;
      color: #b8b0ca;
      font-size: 11px;
    }

    .tip-box svg { color: #b59cfa; flex-shrink: 0; margin-top: 1px; }
    .tip-box strong { color: #ded7f0; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: #050508a8;
      backdrop-filter: blur(5px);
      z-index: 100;
      animation: fadeIn 0.15s ease;
    }

    .modal-overlay.open { display: grid; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%;
      max-width: 460px;
      background: #1a1b22;
      border: 1px solid #393b48;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 20px;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .modal h2 { margin: 0 0 3px; font-size: 16px; }
    .modal .hint { margin: 0 0 16px; color: #898d9a; font-size: 11px; }

    .form-group { margin: 12px 0; }

    .form-group label {
      display: block;
      color: #a9acb7;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #353844;
      border-radius: var(--radius-sm);
      background: #111217;
      padding: 9px 10px;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #8063ba;
      box-shadow: 0 0 0 3px #8b5cf612;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
      font: 11px/1.6 ui-monospace, monospace;
      font-family: inherit;
    }

    .form-group select { cursor: pointer; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: #282a32;
      color: #b7b9c2;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: var(--transition);
    }

    .btn-cancel:hover { background: #343640; }

    .btn-save {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      color: #1e1635;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 650;
      transition: var(--transition);
    }

    .btn-save:hover { box-shadow: 0 4px 16px #8b5cf640; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #e8e2fa;
      color: #211936;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      font-weight: 600;
      font-size: 12px;
      transition: all 0.22s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Keyboard hint */
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid #363944;
      border-radius: 4px;
      padding: 2px 6px;
      color: #737785;
      font-size: 10px;
      white-space: nowrap;
      font-family: inherit;
      background: var(--panel);
    }

    .kbd span { color: var(--muted); }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brandmark">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="m8 9.5 4 2.2 4-2.2M12 12v5"/></svg>
      </div>
      <span>Keystone</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Settings" id="settingsBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8.1 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.5a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5H15v.5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.5H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </button>
      <button class="primary-btn" id="newItemBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New Item
      </button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="nav-section">
        <div class="nav-label">Navigation</div>
        <button class="nav-item active" data-view="library">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
          <span>Library</span>
          <b class="nav-count" id="libraryCount">0</b>
        </button>
        <button class="nav-item" data-view="favorites">
          <svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
          <span>Favorites</span>
          <b class="nav-count" id="favoritesCount">0</b>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Collections</div>
        <button class="nav-item" data-filter="Prompt">
          <svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
          <span>Prompts</span>
          <b class="nav-count" id="promptCount">0</b>
        </button>
        <button class="nav-item" data-filter="File">
          <svg viewBox="0 0 24 24"><path d="m4 17 4-4 3 3 5-6 4 4"/><path d="M4 20h16"/></svg>
          <span>Design Files</span>
          <b class="nav-count" id="fileCount">0</b>
        </button>
        <button class="nav-item" data-filter="Snippet">
          <svg viewBox="0 0 24 24"><path d="M8 9h8M8 13h5"/><path d="M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-3.8-.9L4 20l1.4-3.7A8 8 0 1 1 20 11.5Z"/></svg>
          <span>Snippets</span>
          <b class="nav-count" id="snippetCount">0</b>
        </button>
      </div>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar">JD</div>
          <span>Jordan Davis</span>
        </div>
      </div>
    </aside>

    <section class="library" id="libraryView">
      <div class="library-header">
        <div class="library-title">
          <h1>Your library</h1>
          <p>Everything you want to take with you.</p>
        </div>
        <span class="shortcut-hint"><kbd>⌘</kbd><kbd>K</kbd> to search</span>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="searchInput" placeholder="Search skills, files, and snippets..." autocomplete="off" spellcheck="false" />
        <kbd>⌘</kbd><kbd>K</kbd>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="All">All items</button>
        <button class="filter-btn" data-filter="Prompt">Prompts</button>
        <button class="filter-btn" data-filter="File">Design files</button>
        <button class="filter-btn" data-filter="Snippet">Snippets</button>
        <button class="sort-btn" id="sortBtn">Recently updated <svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="cards-container">
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <section class="detail" id="detailView">
      <div class="detail-empty" id="detailEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
        <p>Select an item to view details</p>
      </div>
      <div class="detail-content" id="detailContent" style="display: none;"></div>
    </section>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <form class="modal" onsubmit="saveItem(event)">
    <h2 id="modalTitle">Add to your library</h2>
    <p class="hint">Save a reusable skill, prompt, snippet, or any file you want close at hand.</p>
    <input type="hidden" id="editingId" />
    <div class="form-group">
      <label for="itemName">Name</label>
      <input id="itemName" required placeholder="e.g. Accessible button checklist" />
    </div>
    <div class="form-group">
      <label for="itemType">Type</label>
      <select id="itemType">
        <option value="Prompt">Prompt</option>
        <option value="Snippet">Snippet</option>
        <option value="File">Design File</option>
      </select>
    </div>
    <div class="form-group">
      <label for="itemDescription">Description</label>
      <input id="itemDescription" placeholder="A short note to help you find it later" />
    </div>
    <div class="form-group">
      <label for="itemTags">Tags (comma-separated)</label>
      <input id="itemTags" placeholder="work, code, personal" />
    </div>
    <div class="form-group">
      <label for="itemTone">Tag Color</label>
      <select id="itemTone">
        <option value="purple">Purple</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="amber">Amber</option>
      </select>
    </div>
    <div class="form-group">
      <label for="itemContent">Content</label>
      <textarea id="itemContent" required placeholder="Paste your prompt, command, or notes here..."></textarea>
    </div>
    <div class="form-group" id="filesGroup" style="display: none;">
      <label for="itemFiles">Attached Files (one per line: name, size)</label>
      <textarea id="itemFiles" placeholder="dashboard.fig, 2.4 MB&#10;icons.fig, 840 KB" rows="4"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn-save" id="saveBtn">Save item</button>
    </div>
  </form>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script type="module" src="./main.js"></script>
</body>
</html>
