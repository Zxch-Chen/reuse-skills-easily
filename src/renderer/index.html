<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keystone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0d;
      --panel: #131318;
      --panel-2: #1b1b22;
      --surface-sunken: #101116; /* inputs, code blocks - recessed relative to panel */
      --surface-tint-hover: #24202f; /* purple-tinted hover for nav/toggles */
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --muted: #93949f;
      --muted-2: #7d818e; /* dimmer tier: uppercase labels, timestamps, hints */
      --text: #f4f4f6;
      --nav-fg: #aeb1bd;
      --accent: #a78bfa;
      --accent-2: #8b5cf6;
      --green: #6ee7b7;
      --amber: #fbbf72;
      --blue: #75b8ff;
      --purple: #c4b5fd;
      --purple-bg: #241d38;
      --red: #f87171;
      --overlay-backdrop: #050508a8;
      --toast-bg: #e8e2fa;
      --toast-fg: #211936;
      --chrome-overlay: rgba(19, 21, 27, 0.9); /* header, sidebar translucent film */
      --detail-overlay: rgba(14, 15, 20, 0.46); /* detail panel translucent film */

      /* Primary brand color - flat, solid (shadcn buttons are solid, not
         gradients), with a dimmed hover rather than a brighter one */
      --primary: #8257e6;
      --primary-hover: #7448d6;
      --primary-foreground: #ffffff;

      /* Focus ring, shadcn's signature 2px ring + offset on interactive elements */
      --ring: #8257e6;
      --ring-offset: var(--bg);

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --shadow-lg: 0 20px 80px rgba(0,0,0,0.6);
      --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Light theme - applied via data-theme="light" on <html>, toggled and
       persisted from the renderer JS. Every color below is a token override;
       component rules never hardcode theme-specific colors directly. */
    :root[data-theme="light"] {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --panel-2: #f1f1f4;
      --surface-sunken: #f3f3f6;
      --surface-tint-hover: #efe9fc;
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.14);
      --muted: #6b6d78;
      --muted-2: #82838d;
      --text: #18181b;
      --nav-fg: #52545e;
      --accent: #7c3aed;
      --accent-2: #7c3aed;
      --green: #15803d;
      --amber: #b45309;
      --blue: #1d4ed8;
      --purple: #6d28d9;
      --purple-bg: #f1ebff;
      --red: #dc2626;
      --overlay-backdrop: rgba(24, 24, 27, 0.35);
      --toast-bg: #18181b;
      --toast-fg: #f7f7f8;
      --chrome-overlay: rgba(255, 255, 255, 0.85);
      --detail-overlay: rgba(255, 255, 255, 0.6);

      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --primary-foreground: #ffffff;
      --ring: #7c3aed;

      --shadow-xs: 0 1px 2px rgba(24,24,27,0.06);
      --shadow-sm: 0 1px 3px rgba(24,24,27,0.08), 0 1px 2px rgba(24,24,27,0.05);
      --shadow-md: 0 4px 14px rgba(24,24,27,0.1);
      --shadow-lg: 0 20px 60px rgba(24,24,27,0.18);
    }

    /* shadcn's hallmark: a clean, consistent focus-visible ring on every
       interactive element, keyboard-only (no ring on mouse click) */
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100%; 
      width: 100%;
      overflow: hidden;
    }

    body {
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: .005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
    }

    button { cursor: pointer; background: none; }
    
    svg { 
      width: 16px; 
      height: 16px; 
      stroke: currentColor; 
      fill: none; 
      stroke-width: 1.8; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      flex-shrink: 0;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4150; }

    /* App Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 800px 500px at 60% -20%, rgba(91,52,157,.12), transparent 70%);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome-overlay);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -.02em;
    }

    .expand-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      background: none;
      border: none;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .expand-toggle:hover { background: var(--surface-tint-hover); color: var(--text); }
    .expand-toggle svg { width: 15px; height: 15px; }

    .brandmark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      color: #fff;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      box-shadow: 0 4px 14px #7c3aed3d;
    }

    .brandmark svg { width: 13px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      background: transparent;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    /* Theme toggle shows only the icon for the theme you'd switch TO */
    .theme-icon-light { display: none; }
    :root[data-theme="light"] .theme-icon-dark { display: none; }
    :root[data-theme="light"] .theme-icon-light { display: block; }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
      font-size: 12px;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
      border: none;
    }

    .primary-btn:hover { background: var(--primary-hover); }
    .primary-btn:active { transform: scale(0.98); }

    .primary-btn svg { width: 14px; height: 14px; }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 16px 10px;
      border-right: 1px solid var(--line);
      background: var(--chrome-overlay);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width .16s ease;
    }

    .sidebar.collapsed {
      width: 56px;
      padding: 16px 8px;
    }

    /* Fully hidden in the default compact/Favorites mode - not just the icon
       rail. The header's expand-toggle is the way back in. */
    .sidebar.hidden {
      width: 0;
      padding: 0;
      border-right: none;
      overflow: hidden;
    }

    .sidebar-toggle {
      align-self: flex-end;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 12px;
      border-radius: var(--radius-sm);
      color: var(--muted-2);
      border: none;
      background: none;
      transition: var(--transition);
    }

    .sidebar-toggle:hover { color: var(--text); background: var(--surface-tint-hover); }
    .sidebar-toggle svg { width: 13px; height: 13px; transition: transform .16s ease; }
    .sidebar.collapsed .sidebar-toggle { align-self: center; transform: rotate(180deg); }

    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-item span,
    .sidebar.collapsed .nav-count,
    .sidebar.collapsed .user-info span {
      display: none;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      gap: 0;
      padding: 9px 0;
    }

    .sidebar.collapsed .user-info {
      justify-content: center;
      padding: 8px 0;
    }

    .nav-section {
      margin-bottom: 20px;
    }

    .nav-label {
      color: var(--muted-2);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 700;
      padding: 0 10px;
      margin-bottom: 8px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--nav-fg);
      background: none;
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      text-align: left;
      margin: 2px 0;
      transition: var(--transition);
      border: none;
      font-size: 13px;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text);
      background: var(--surface-tint-hover);
    }

    .nav-item.active {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .nav-item svg { color: inherit; }

    .nav-count {
      margin-left: auto;
      color: var(--muted-2);
      font-size: 11px;
      font-weight: 500;
    }

    .nav-item.active .nav-count { color: var(--purple); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      color: var(--nav-fg);
      font-size: 12px;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #334155;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
    }

    /* Library View */
    .library {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .library-title h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.035em;
      margin: 0;
    }

    .library-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .shortcut-hint {
      color: var(--muted-2);
      font-size: 11px;
      padding-top: 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 36px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius-md);
      padding: 0 12px;
      color: var(--muted-2);
      margin-bottom: 12px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(130, 87, 230, 0.15);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      font-size: 12px;
      width: 100%;
    }

    .search-box kbd {
      display: flex;
      align-items: center;
      gap: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--muted-2);
      font-size: 10px;
      white-space: nowrap;
      font-family: inherit;
    }

    .search-box kbd span { color: var(--muted); }

    .filters {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      white-space: nowrap;
      transition: var(--transition);
    }

    .filter-btn:hover,
    .filter-btn.active {
      color: #ddd6fe;
      background: #282039;
      border-color: #584587;
    }

    .sort-btn {
      margin-left: auto;
      background: none;
      color: var(--muted-2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      padding: 5px 8px;
      border-radius: 20px;
      transition: var(--transition);
    }

    .sort-btn:hover { color: var(--text); background: var(--panel-2); }

    .cards-container {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Favorites' compact rows - just the name, tiny actions, and type badge
       at a glance (~50px each), so you can scan and copy quickly. */
    .cards.compact { gap: 4px; }
    .cards.compact .card { padding: 10px 12px; }
    .cards.compact .card-header { margin-bottom: 0; }
    .cards.compact .card-description,
    .cards.compact .card-footer {
      display: none;
    }

    .card {
      position: relative;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
      cursor: pointer;
      user-select: none; /* text selection fights with starting a native drag */
      transition: var(--transition);
    }

    .card:hover { background: var(--panel-2); border-color: var(--line-strong); }
    .card.selected { background: #201a30; border-color: var(--primary); box-shadow: 0 0 0 1px rgba(130,87,230,0.15); }

    /* Hover overlay makes the click-to-copy action obvious - dims the card
       and shows a centered label, similar to a thumbnail hover-to-play hint */
    .card-copy-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 16, 21, 0.78);
      border-radius: var(--radius-md);
      color: #ddd6fe;
      font-size: 12px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
    }

    .card-copy-hint svg { width: 14px; height: 14px; }

    .card-copy-hint.copied {
      background: rgba(28, 54, 38, 0.9);
      color: #7ee0a0;
    }

    /* Hover-only, deliberately not :focus-within - a click leaves the card
       focused, and focus-within would keep this stuck open after the cursor
       actually leaves. */
    .card:hover .card-copy-hint {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }

    .card-actions {
      position: relative;
      z-index: 1; /* stay visible above the copy-hint overlay */
      flex-shrink: 0;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
    }

    .card:hover .card-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .card-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: #22242c;
      border: 1px solid #34363f;
      color: #b6b9c3;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }

    .card-action-btn svg { width: 13px; height: 13px; }
    .card-action-btn:hover { background: #2c2440; border-color: #584587; color: #ddd6fe; }
    .card-action-btn.delete:hover { background: #3a2229; border-color: #7a3b45; color: #f2a3ae; }

    .card-action-btn.favorite-toggle.active {
      background: #332a12;
      border-color: #8a6a1f;
      color: #f5c878;
    }
    .card-action-btn.favorite-toggle:hover { background: #3a2f14; border-color: #a17e26; color: #f5c878; }

    /* Dragging - only enabled in the favorites view's custom sort order */
    .card.dragging { opacity: 0.4; }
    .card.drag-over { box-shadow: inset 0 2px 0 0 var(--purple), inset 0 -2px 0 0 transparent; }
    .card[draggable="true"] { cursor: grab; -webkit-user-drag: element; }
    .card[draggable="true"]:active { cursor: grabbing; }

    .card-title {
      font-weight: 650;
      font-size: 13px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .star-badge {
      color: #f5c878;
      margin-left: 5px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .card-type {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-description {
      color: var(--muted);
      font-size: 11.5px;
      margin: 0 0 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted-2);
      font-size: 10px;
    }

    .tag {
      border-radius: 999px;
      color: #b9a9e6;
      background: #2c2441;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 500;
    }

    .tag.blue { color: #9cc9fa; background: #1c2f45; }
    .tag.green { color: #96e5c5; background: #18382f; }
    .tag.amber { color: #f1c786; background: #3a2c1d; }
    .tag.purple { color: #c4b5fd; background: #2c2441; }

    .card-updated { margin-left: auto; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 13px;
    }

    .empty-state small { display: block; margin-top: 6px; color: var(--muted-2); }

    /* Detail View */
    .detail {
      width: 100%;
      max-width: 480px;
      flex-shrink: 0;
      padding: 24px;
      overflow-y: auto;
      background: var(--detail-overlay);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: width .16s ease;
    }

    /* Collapsed when nothing is selected, so the library list is the default,
       full-width view; selecting an item expands this back open. */
    .detail.collapsed {
      width: 0;
      padding: 0;
      border-left: none;
      overflow: hidden;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
    }

    .detail-empty svg { color: #3d4150; margin-bottom: 12px; }

    /* JS toggles `display` inline (flex/none); flex-direction lives here so
       sections stack vertically instead of flexbox's default row */
    .detail-content { flex-direction: column; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .detail-title-area {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
    }

    .large-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--purple);
      background: var(--purple-bg);
      border-radius: 8px;
      flex-shrink: 0;
      font-size: 16px;
    }

    .detail-title-area h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-sub {
      color: var(--muted);
      font-size: 11px;
    }

    .synced-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #a9b8e0;
      cursor: default;
    }

    .synced-badge svg { color: #7c93d6; }

    .detail-tools {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      transition: var(--transition);
    }

    .tool-btn.icon-only { padding: 6px; }

    .favorite-btn {
      color: #bbb0df;
      background: #29223c;
    }

    .favorite-btn:hover { background: #3b2e57; }
    .favorite-btn.active { color: #f5c878; background: #3a2c1d; }

    .edit-btn {
      color: #bbb0df;
      background: #29223c;
    }

    .edit-btn:hover { background: #3b2e57; }

    .delete-btn {
      color: var(--red);
      background: #3a2424;
    }

    .delete-btn:hover { background: #4a2a2a; }

    .detail-section {
      margin-top: 18px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 8px;
    }

    .copy-btn {
      color: var(--muted);
      background: none;
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .copy-btn:hover { color: var(--text); background: var(--panel-2); }
    .copy-btn.copied { color: var(--green); }

    .code-block {
      background: var(--surface-sunken);
      border: 1px solid #272a34;
      border-radius: var(--radius-md);
      padding: 14px 15px;
      color: #d9d5e7;
      font: 11.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: auto;
      max-height: 300px;
    }

    .code-block .comment { color: #6f7080; }
    .code-block .key { color: var(--purple); }
    .code-block .string { color: var(--green); }
    .code-block .flag { color: var(--amber); }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meta-item { display: flex; flex-direction: column; gap: 3px; }

    .meta-label { color: var(--muted-2); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }

    .meta-value { color: var(--text); font-size: 12px; }

    .meta-value span { color: var(--muted); }

    .files-list { display: flex; flex-direction: column; gap: 6px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      background: var(--surface-sunken);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .file-icon { color: #a7bff5; font-size: 14px; }
    .file-name { font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: var(--muted-2); font-size: 10px; white-space: nowrap; }
    .file-download { color: var(--muted); background: none; padding: 3px; display: grid; place-items: center; border-radius: 4px; transition: var(--transition); }
    .file-download:hover { color: var(--text); background: var(--panel-2); }

    .tip-box {
      margin-top: 20px;
      border: 1px solid #3b3158;
      background: linear-gradient(100deg, #211b31, #191a24);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 9px;
      color: #b8b0ca;
      font-size: 11px;
    }

    .tip-box svg { color: #b59cfa; flex-shrink: 0; margin-top: 1px; }
    .tip-box strong { color: #ded7f0; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: var(--overlay-backdrop);
      backdrop-filter: blur(5px);
      z-index: 100;
      animation: fadeIn 0.15s ease;
    }

    .modal-overlay.open { display: grid; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%;
      max-width: 460px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 20px;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .modal h2 { margin: 0 0 3px; font-size: 16px; }
    .modal .hint { margin: 0 0 16px; color: var(--muted); font-size: 11px; }

    .form-group { margin: 12px 0; }

    .form-group label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-sunken);
      padding: 9px 10px;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(130, 87, 230, 0.15);
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
      font: 11px/1.6 ui-monospace, monospace;
      font-family: inherit;
    }

    .form-group select { cursor: pointer; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: #282a32;
      color: #b7b9c2;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: var(--transition);
    }

    .btn-cancel:hover { background: #343640; }

    .btn-save {
      background: var(--primary);
      color: var(--primary-foreground);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
    }

    .btn-save:hover { background: var(--primary-hover); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: var(--toast-bg);
      color: var(--toast-fg);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      font-weight: 600;
      font-size: 12px;
      transition: all 0.22s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Keyboard hint */
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--muted-2);
      font-size: 10px;
      white-space: nowrap;
      font-family: inherit;
      background: var(--panel);
    }

    .kbd span { color: var(--muted); }

    /* Light-mode overrides for components with per-variant colors that
       aren't a simple token swap (badges, colored buttons, tip-box, etc.) -
       code-block, the brandmark, the avatar, and the copy-hint overlay are
       deliberately left as fixed colors in both themes. */
    :root[data-theme="light"] .filter-btn:hover,
    :root[data-theme="light"] .filter-btn.active {
      color: #6d28d9;
      background: #f1ebff;
      border-color: #d9c9fb;
    }

    :root[data-theme="light"] .card.selected { background: #f6f2ff; }

    :root[data-theme="light"] .card-action-btn {
      background: #f1f1f4;
      border-color: #e2e2e7;
      color: #55575f;
    }
    :root[data-theme="light"] .card-action-btn:hover {
      background: #f1ebff;
      border-color: #d9c9fb;
      color: #6d28d9;
    }
    :root[data-theme="light"] .card-action-btn.delete:hover {
      background: #fde8e8;
      border-color: #f3b8b8;
      color: #b91c1c;
    }
    :root[data-theme="light"] .card-action-btn.favorite-toggle.active {
      background: #fef3dc;
      border-color: #f5d78e;
      color: #92650a;
    }
    :root[data-theme="light"] .card-action-btn.favorite-toggle:hover {
      background: #fdecc4;
      border-color: #eec06a;
      color: #92650a;
    }

    :root[data-theme="light"] .star-badge { color: #b8860b; }

    :root[data-theme="light"] .tag { color: #6d28d9; background: #f1ebff; }
    :root[data-theme="light"] .tag.blue { color: #1d4ed8; background: #e5edff; }
    :root[data-theme="light"] .tag.green { color: #15803d; background: #e3f6e9; }
    :root[data-theme="light"] .tag.amber { color: #b45309; background: #fdf1de; }
    :root[data-theme="light"] .tag.purple { color: #6d28d9; background: #f1ebff; }

    :root[data-theme="light"] .synced-badge { color: #4152a0; }
    :root[data-theme="light"] .synced-badge svg { color: #5470c4; }

    :root[data-theme="light"] .favorite-btn,
    :root[data-theme="light"] .edit-btn {
      color: #6d28d9;
      background: #f1ebff;
    }
    :root[data-theme="light"] .favorite-btn:hover,
    :root[data-theme="light"] .edit-btn:hover { background: #e5d8fb; }
    :root[data-theme="light"] .favorite-btn.active { color: #92650a; background: #fef3dc; }

    :root[data-theme="light"] .delete-btn { color: #dc2626; background: #fde8e8; }
    :root[data-theme="light"] .delete-btn:hover { background: #fbd2d2; }

    :root[data-theme="light"] .tip-box {
      border-color: #e2d4fb;
      background: linear-gradient(100deg, #f7f2ff, #f9f7fd);
      color: #5b5468;
    }
    :root[data-theme="light"] .tip-box svg { color: #8b5cf6; }
    :root[data-theme="light"] .tip-box strong { color: #3f2d63; }

    :root[data-theme="light"] .btn-cancel { background: #eeeef1; color: #3f4148; }
    :root[data-theme="light"] .btn-cancel:hover { background: #e2e2e7; }

    :root[data-theme="light"] .file-icon { color: #2563eb; }
    :root[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #c7c7cf; }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <button class="expand-toggle" id="expandToggle" title="Show full library" aria-label="Show full library">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brandmark">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="m8 9.5 4 2.2 4-2.2M12 12v5"/></svg>
      </div>
      <span>Keystone</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Switch to light theme" id="themeToggleBtn" aria-label="Switch to light theme">
        <svg class="theme-icon-dark" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
        <svg class="theme-icon-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="icon-btn" title="Settings" id="settingsBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8.1 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.5a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5H15v.5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.5H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </button>
      <button class="primary-btn" id="newItemBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New Item
      </button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="nav-section">
        <div class="nav-label">Navigation</div>
        <button class="nav-item" data-view="library" title="Library">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
          <span>Library</span>
          <b class="nav-count" id="libraryCount">0</b>
        </button>
        <button class="nav-item active" data-view="favorites" title="Favorites">
          <svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
          <span>Favorites</span>
          <b class="nav-count" id="favoritesCount">0</b>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Collections</div>
        <button class="nav-item" data-filter="Prompt" title="Prompts">
          <svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
          <span>Prompts</span>
          <b class="nav-count" id="promptCount">0</b>
        </button>
        <button class="nav-item" data-filter="File" title="Design Files">
          <svg viewBox="0 0 24 24"><path d="m4 17 4-4 3 3 5-6 4 4"/><path d="M4 20h16"/></svg>
          <span>Design Files</span>
          <b class="nav-count" id="fileCount">0</b>
        </button>
        <button class="nav-item" data-filter="Snippet" title="Snippets">
          <svg viewBox="0 0 24 24"><path d="M8 9h8M8 13h5"/><path d="M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-3.8-.9L4 20l1.4-3.7A8 8 0 1 1 20 11.5Z"/></svg>
          <span>Snippets</span>
          <b class="nav-count" id="snippetCount">0</b>
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Sources</div>
        <button class="nav-item" data-source="claude-skill" title="Claude Code">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.4 6.6L20 11l-6.6 1.4L12 19l-1.4-6.6L4 11l6.6-1.4L12 3Z"/></svg>
          <span>Claude Code</span>
          <b class="nav-count" id="claudeSourceCount">0</b>
        </button>
        <button class="nav-item" data-source="codex-skill" title="Codex CLI">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3.5 3L7 15"/><path d="M13 15h4"/></svg>
          <span>Codex CLI</span>
          <b class="nav-count" id="codexSourceCount">0</b>
        </button>
        <button class="nav-item" data-source="cursor-rule" title="Cursor">
          <svg viewBox="0 0 24 24"><path d="M5 3l4.5 15.5 2.3-6.2L18 10 5 3Z"/></svg>
          <span>Cursor</span>
          <b class="nav-count" id="cursorSourceCount">0</b>
        </button>
      </div>
      <div class="sidebar-footer">
        <div class="user-info" title="Jordan Davis">
          <div class="avatar">JD</div>
          <span>Jordan Davis</span>
        </div>
      </div>
    </aside>

    <section class="library" id="libraryView">
      <div class="library-header" id="libraryHeader">
        <div class="library-title">
          <h1>Your library</h1>
          <p>Everything you want to take with you.</p>
        </div>
        <span class="shortcut-hint"><kbd>⌘</kbd><kbd>K</kbd> to search</span>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="searchInput" placeholder="Search skills, files, and snippets..." autocomplete="off" spellcheck="false" />
        <kbd>⌘</kbd><kbd>K</kbd>
      </div>
      <div class="filters">
        <div class="filter-pills" id="filterPills">
          <button class="filter-btn active" data-filter="All">All items</button>
          <button class="filter-btn" data-filter="Prompt">Prompts</button>
          <button class="filter-btn" data-filter="File">Design files</button>
          <button class="filter-btn" data-filter="Snippet">Snippets</button>
        </div>
        <button class="sort-btn" id="sortBtn">Recently updated <svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="cards-container">
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <section class="detail" id="detailView">
      <div class="detail-empty" id="detailEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
        <p>Select an item to view details</p>
      </div>
      <div class="detail-content" id="detailContent" style="display: none;"></div>
    </section>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <form class="modal" onsubmit="saveItem(event)">
    <h2 id="modalTitle">Add to your library</h2>
    <p class="hint">Save a reusable skill, prompt, snippet, or any file you want close at hand.</p>
    <input type="hidden" id="editingId" />
    <div class="form-group">
      <label for="itemName">Name</label>
      <input id="itemName" required placeholder="e.g. Accessible button checklist" />
    </div>
    <div class="form-group">
      <label for="itemType">Type</label>
      <select id="itemType">
        <option value="Prompt">Prompt</option>
        <option value="Snippet">Snippet</option>
        <option value="File">Design File</option>
      </select>
    </div>
    <div class="form-group">
      <label for="itemDescription">Description</label>
      <input id="itemDescription" placeholder="A short note to help you find it later" />
    </div>
    <div class="form-group">
      <label for="itemTags">Tags (comma-separated)</label>
      <input id="itemTags" placeholder="work, code, personal" />
    </div>
    <div class="form-group">
      <label for="itemTone">Tag Color</label>
      <select id="itemTone">
        <option value="purple">Purple</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="amber">Amber</option>
      </select>
    </div>
    <div class="form-group">
      <label for="itemContent">Content</label>
      <textarea id="itemContent" required placeholder="Paste your prompt, command, or notes here..."></textarea>
    </div>
    <div class="form-group" id="filesGroup" style="display: none;">
      <label for="itemFiles">Attached Files (one per line: name, size)</label>
      <textarea id="itemFiles" placeholder="dashboard.fig, 2.4 MB&#10;icons.fig, 840 KB" rows="4"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn-save" id="saveBtn">Save item</button>
    </div>
  </form>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script type="module" src="./main.js"></script>
</body>
</html>
